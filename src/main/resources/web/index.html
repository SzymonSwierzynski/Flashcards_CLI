<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6ebf1;
    --ink: #1d2838;
    --muted: #66758a;
    --card: #ffffff;
    --rule: #c9d8ea;
    --margin: #d6473f;
    --good: #2b8a57;
    --line: #d3dbe5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18202c; --ink: #e6ecf3; --muted: #8b99ad; --card: #222c3a;
      --rule: #2e3b4e; --margin: #ef6a5f; --good: #4fbf83; --line: #2f3b4d;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Bricolage Grotesque", system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--margin); outline-offset: 2px; }

  header {
    max-width: 760px; margin: 0 auto; padding: 24px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
  nav { display: flex; gap: 4px; background: var(--card); padding: 4px; border-radius: 999px; }
  nav button {
    border: 0; background: none; padding: 6px 16px; border-radius: 999px; cursor: pointer; color: var(--muted);
  }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

  main { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
  [hidden] { display: none !important; }

  /* The index card: the one loud element on the page. */
  .index-card {
    background:
      linear-gradient(var(--card) 0 150px, transparent 150px),
      repeating-linear-gradient(to bottom, transparent 0 39px, var(--rule) 39px 40px) 0 32px,
      var(--card);
    border-top: 4px solid var(--margin);
    border-radius: 4px;
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(29, 40, 56, .45);
    min-height: 360px; padding: 32px 40px 40px;
    display: flex; flex-direction: column;
    transition: transform .35s ease;
  }
  .index-card.flip { transform: rotateX(8deg) scale(.985); }
  .count { color: var(--muted); font-size: .875rem; margin: 0; }
  .term {
    font-size: clamp(2.5rem, 9vw, 4.5rem); font-weight: 700; line-height: 1.05;
    letter-spacing: -0.03em; margin: 24px 0 auto; overflow-wrap: anywhere;
  }
  .answer-row { display: flex; gap: 12px; margin-top: 40px; align-items: end; }
  .answer-row input {
    flex: 1; min-width: 0; border: 0; border-bottom: 2px solid var(--ink); background: transparent;
    font-size: 1.375rem; padding: 4px 0;
  }
  .answer-row input:focus { outline: none; border-bottom-color: var(--margin); }
  .feedback { margin-top: 40px; font-size: 1.125rem; min-height: 1.5em; }
  .feedback strong { font-weight: 700; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--margin); }
  .feedback .hint { display: block; color: var(--muted); font-size: 1rem; }

  .btn {
    border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    background: var(--ink); color: var(--bg); font-weight: 500; white-space: nowrap;
  }
  .btn.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn:disabled { opacity: .4; cursor: default; }

  .score { display: flex; gap: 24px; color: var(--muted); margin: 16px 4px 0; font-size: .9375rem; }
  .score b { color: var(--ink); font-weight: 500; }

  .empty { text-align: center; padding: 64px 16px; color: var(--muted); }
  .empty p { margin: 0 0 16px; }

  /* Deck */
  form.add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; }
  form.add input {
    border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 12px; min-width: 0;
  }
  .msg { min-height: 1.5em; margin: 0 0 16px; font-size: .9375rem; color: var(--muted); }
  .msg.bad { color: var(--margin); }

  ul.deck { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 8px; }
  ul.deck li {
    display: grid; grid-template-columns: 1fr 1fr 72px 32px; gap: 12px; align-items: center;
    padding: 12px 16px; border-top: 1px solid var(--line); border-left: 3px solid transparent;
  }
  ul.deck li:first-child { border-top: 0; }
  ul.deck li.hardest { border-left-color: var(--margin); }
  .def { color: var(--muted); overflow-wrap: anywhere; }
  .t { font-weight: 500; overflow-wrap: anywhere; }
  .miss { font-size: .875rem; color: var(--muted); text-align: right; }
  .hardest .miss { color: var(--margin); }
  .x {
    border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 1.25rem; line-height: 1;
    width: 32px; height: 32px; border-radius: 50%;
  }
  .x:hover { background: var(--bg); color: var(--margin); }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
  .tools .legend { margin-left: auto; color: var(--muted); font-size: .875rem; }
  .tools .legend::before {
    content: ""; display: inline-block; width: 3px; height: 1em; background: var(--margin);
    vertical-align: -2px; margin-right: 8px;
  }

  @media (max-width: 560px) {
    .index-card { padding: 24px 20px 28px; min-height: 320px; }
    .answer-row { flex-direction: column; align-items: stretch; }
    form.add { grid-template-columns: 1fr; }
    ul.deck li { grid-template-columns: 1fr auto 32px; }
    ul.deck li .def { grid-column: 1; grid-row: 2; }
    .tools .legend { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .index-card { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Flashcards</h1>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-view="practice">Practice</button>
    <button role="tab" aria-selected="false" data-view="deck">Deck</button>
  </nav>
</header>

<main>
  <section id="practice">
    <div id="noCards" class="empty" hidden>
      <p>Your deck is empty. Add a few cards to start practicing.</p>
      <button class="btn" data-goto="deck">Add cards</button>
    </div>
    <div id="practiceArea" hidden>
      <article class="index-card" id="card">
        <p class="count" id="count"></p>
        <h2 class="term" id="term"></h2>
        <form class="answer-row" id="answerForm" autocomplete="off">
          <input id="answer" aria-label="Your definition" placeholder="Type the definition">
          <button class="btn">Check</button>
        </form>
        <div class="feedback" id="feedback" hidden aria-live="polite"></div>
      </article>
      <div class="score">
        <span>Correct <b id="right">0</b></span>
        <span>Wrong <b id="wrong">0</b></span>
      </div>
    </div>
  </section>

  <section id="deck" hidden>
    <form class="add" id="addForm" autocomplete="off">
      <input name="term" placeholder="Term, e.g. France" aria-label="Term" required>
      <input name="definition" placeholder="Definition, e.g. Paris" aria-label="Definition" required>
      <button class="btn">Add card</button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
    <ul class="deck" id="list"></ul>
    <div class="tools">
      <button class="btn quiet" id="importBtn">Import file</button>
      <a class="btn quiet" href="/api/export" download style="text-decoration:none">Export file</a>
      <button class="btn quiet" id="resetBtn">Reset mistakes</button>
      <span class="legend">Most-missed cards</span>
      <input type="file" id="file" accept=".txt,text/plain" hidden>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const post = (url, data) => fetch(url, { method: "POST", body: new URLSearchParams(data) });
let current = null, checked = false, right = 0, wrong = 0, deckSize = 0;

function show(view) {
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  $("practice").hidden = view !== "practice";
  $("deck").hidden = view !== "deck";
  view === "deck" ? loadDeck() : nextCard();
}
document.querySelectorAll("[data-view],[data-goto]").forEach(b =>
  b.addEventListener("click", () => show(b.dataset.view || b.dataset.goto)));

async function nextCard() {
  const res = await fetch("/api/next");
  const empty = res.status === 404;
  $("noCards").hidden = !empty;
  $("practiceArea").hidden = empty;
  if (empty) return;
  current = (await res.json()).term;
  checked = false;
  $("term").textContent = current;
  $("count").textContent = `Card ${right + wrong + 1}`;
  $("answer").value = "";
  $("answer").disabled = false;
  $("feedback").hidden = true;
  $("answerForm").querySelector("button").textContent = "Check";
  $("card").classList.add("flip");
  requestAnimationFrame(() => requestAnimationFrame(() => $("card").classList.remove("flip")));
  $("answer").focus();
}

$("answerForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (checked) return nextCard();
  const answer = $("answer").value.trim();
  if (!answer) return $("answer").focus();
  const r = await (await post("/api/answer", { term: current, answer })).json();
  checked = true;
  r.correct ? right++ : wrong++;
  $("right").textContent = right;
  $("wrong").textContent = wrong;
  const fb = $("feedback");
  fb.className = "feedback " + (r.correct ? "good" : "bad");
  fb.replaceChildren();
  if (r.correct) {
    fb.append("Correct.");
  } else {
    const s = document.createElement("strong");
    s.textContent = r.definition;
    fb.append("The answer is ", s, ".");
    if (r.otherTerm) {
      const h = document.createElement("span");
      h.className = "hint";
      h.textContent = `Your answer fits “${r.otherTerm}”.`;
      fb.append(h);
    }
  }
  fb.hidden = false;
  $("answer").disabled = true;
  const btn = $("answerForm").querySelector("button");
  btn.textContent = "Next card";
  btn.focus();
});

async function loadDeck() {
  const cards = await (await fetch("/api/cards")).json();
  deckSize = cards.length;
  const list = $("list");
  list.replaceChildren();
  list.hidden = !cards.length;
  for (const c of cards) {
    const li = document.createElement("li");
    li.className = c.hardest ? "hardest" : "";
    const t = Object.assign(document.createElement("span"), { className: "t", textContent: c.term });
    const d = Object.assign(document.createElement("span"), { className: "def", textContent: c.definition });
    const m = Object.assign(document.createElement("span"), {
      className: "miss", textContent: c.mistakes ? `${c.mistakes} missed` : ""
    });
    const x = Object.assign(document.createElement("button"), {
      className: "x", textContent: "×", title: `Remove ${c.term}`
    });
    x.setAttribute("aria-label", `Remove ${c.term}`);
    x.onclick = async () => { await post("/api/remove", { term: c.term }); say(`Removed “${c.term}”.`); loadDeck(); };
    li.append(t, d, m, x);
    list.append(li);
  }
  if (!cards.length) say("No cards yet. Add your first one above, or import a file.");
}

function say(text, bad = false) { $("msg").textContent = text; $("msg").className = "msg" + (bad ? " bad" : ""); }

const ADD_MESSAGES = {
  ADDED: (t, d) => `Added “${t}” → “${d}”.`,
  TERM_ALREADY_EXISTS: t => `“${t}” is already in your deck.`,
  DEFINITION_ALREADY_EXISTS: (t, d) => `Another card already uses the definition “${d}”.`,
  NO_VALUE: () => "Fill in both the term and the definition."
};
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target, term = form.term.value.trim(), definition = form.definition.value.trim();
  const { result } = await (await post("/api/cards", { term, definition })).json();
  say(ADD_MESSAGES[result](term, definition), result !== "ADDED");
  if (result === "ADDED") { form.reset(); form.term.focus(); loadDeck(); }
});

$("importBtn").onclick = () => $("file").click();
$("file").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const res = await fetch("/api/import", { method: "POST", body: file });
  const r = await res.json();
  res.ok ? say(`Imported ${r.loaded} cards from ${file.name}.`) : say(`Couldn't import ${file.name}: ${r.error}.`, true);
  e.target.value = "";
  loadDeck();
};
// Two-click confirm instead of confirm(): some embedded browsers block native dialogs.
let resetTimer = null;
$("resetBtn").onclick = async () => {
  const btn = $("resetBtn");
  if (!deckSize) return say("No cards to reset.");
  if (!resetTimer) {
    btn.textContent = "Click again to reset all";
    resetTimer = setTimeout(() => { btn.textContent = "Reset mistakes"; resetTimer = null; }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  resetTimer = null;
  btn.textContent = "Reset mistakes";
  await post("/api/reset", {});
  say("Mistakes reset.");
  loadDeck();
};

nextCard();
</script>
</body>
</html>
